name: iOS Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: false
        default: "2.1"

jobs:
  ios-build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool
          pip install buildozer kivy-ios

      - name: Build iOS app with kivy-ios toolchain (no codesign, device)
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          export PYTHONUNBUFFERED=1
          LOG="$GITHUB_WORKSPACE/ios-build.log"
          pip install kivy-ios 2>/dev/null || true
          # stage a clean app dir (exclude .git / build junk to avoid rsync vanished-files)
          mkdir -p ios_app
          rsync -a --exclude='.git' --exclude='.buildozer' --exclude='bin' \
            --exclude='test_images' --exclude='tools' --exclude='ui参考文件' \
            --exclude='screenshots' --exclude='__pycache__' --exclude='.venv*' \
            --exclude='fitness.db' --exclude='assets/catalog/gifs' \
            /Users/runner/work/fitness/fitness/ ios_app/
          ls ios_app | head -30
          mkdir -p .buildozer/ios/platform/kivy-ios
          cd .buildozer/ios/platform/kivy-ios
          toolchain build python3 kivy 2>&1 | tee "$LOG"
          toolchain create FitnessTracker /Users/runner/work/fitness/fitness/ios_app 2>&1 | tee -a "$LOG"
          ls -la
          find . -name "*.xcodeproj" -maxdepth 4 -print
          APP_PROJ=$(find . -name "*.xcodeproj" -maxdepth 4 | head -1)
          echo "PROJECT=$APP_PROJ"
          xcodebuild -project "$APP_PROJ" \
            -scheme fitnesstracker \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee -a "$LOG"
          cd /Users/runner/work/fitness/fitness
          find . -name "*.app" -maxdepth 12 -not -path "*IDLE*" -print
          find . -name "*.app" -maxdepth 12 -not -path "*IDLE*" | tee "$GITHUB_WORKSPACE/app_paths.txt"

      - name: Collect artifacts
        if: always()
        run: |
          echo "=== find .app in DerivedData ==="
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -maxdepth 6 -print 2>/dev/null
          mkdir -p artifacts
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -maxdepth 6 -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            cp -R "$APP" artifacts/
            ls -la artifacts/
            echo "$APP" > app_paths.txt
          else
            echo "no .app found"
          fi

      - name: Upload .app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fitnessapp-ios-device
          path: |
            artifacts/
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ios-build.log
            app_paths.txt
          if-no-files-found: warn
