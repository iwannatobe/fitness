name: iOS Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: false
        default: "2.1"

jobs:
  ios-build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool
          pip install buildozer kivy-ios

      - name: Build iOS app with kivy-ios toolchain (no codesign, simulator)
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          export PYTHONUNBUFFERED=1
          # install kivy-ios if not present
          pip install kivy-ios 2>/dev/null || true
          # prepare a fresh dist dir; build recipes
          mkdir -p .buildozer/ios/platform/kivy-ios
          cd .buildozer/ios/platform/kivy-ios
          toolchain build python3 kivy 2>&1 | tee ../../../ios-build.log
          toolchain create FitnessTracker /Users/runner/work/fitness/fitness 2>&1 | tee -a ../../../ios-build.log
          ls -la
          ls -la FitnessTracker-ios/ 2>/dev/null || true
          xcodebuild -project FitnessTracker-ios/FitnessTracker.xcodeproj \
            -scheme FitnessTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a ../../../ios-build.log
          cd /Users/runner/work/fitness/fitness
          find . -name "*.app" -maxdepth 8 -print

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          echo "--- .app bundles ---"
          find . -name "*.app" -maxdepth 8 -print
          echo "--- ipa ---"
          find . -name "*.ipa" -maxdepth 8 -print
          echo "--- bin ---"
          ls -la bin/ 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ios-build.log
          if-no-files-found: warn
