name: iOS Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: false
        default: "2.1"

jobs:
  ios-build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          brew install autoconf automake libtool pkg-config
          brew link libtool
          pip install buildozer kivy-ios

      - name: Build iOS app with kivy-ios toolchain (no codesign, simulator)
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          export PYTHONUNBUFFERED=1
          LOG="$GITHUB_WORKSPACE/ios-build.log"
          pip install kivy-ios 2>/dev/null || true
          mkdir -p .buildozer/ios/platform/kivy-ios
          cd .buildozer/ios/platform/kivy-ios
          toolchain build python3 kivy 2>&1 | tee "$LOG"
          toolchain create FitnessTracker /Users/runner/work/fitness/fitness 2>&1 | tee -a "$LOG"
          ls -la
          # toolchain lowercases the title: fitnesstracker-ios/fitnesstracker.xcodeproj
          find . -name "*.xcodeproj" -maxdepth 4 -print
          APP_PROJ=$(find . -name "*.xcodeproj" -maxdepth 4 | head -1)
          echo "PROJECT=$APP_PROJ"
          xcodebuild -project "$APP_PROJ" \
            -scheme fitnesstracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a "$LOG"
          cd /Users/runner/work/fitness/fitness
          find . -name "*.app" -maxdepth 12 -print
          find . -name "*.app" -maxdepth 12 | tee "$GITHUB_WORKSPACE/app_paths.txt"

      - name: Collect artifacts
        if: always()
        run: |
          echo "=== app_paths ==="
          cat app_paths.txt 2>/dev/null || echo "no app_paths.txt"
          echo "=== bin ==="
          ls -la bin/ 2>/dev/null || true

      - name: Upload .app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fitnessapp-ios-simulator
          path: |
            **/*.app
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ios-build.log
            app_paths.txt
          if-no-files-found: warn
